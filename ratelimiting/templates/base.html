
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecureLab{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'ratelimiting/css/style.css' %}">
    <script src="{% static 'ratelimiting/js/main.js' %}" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'home' %}" class="brand">Secure<span>Lab</span></a>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button class="nav-button" type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}" class="nav-cta">Sign up</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
