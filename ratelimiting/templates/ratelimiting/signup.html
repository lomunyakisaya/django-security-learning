
{% extends "base.html" %}

{% block title %}Sign up | SecureLab{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">CREATE ACCOUNT</p>
    <h1>Sign up</h1>

    {% if form.errors %}
        <div class="error">Please correct the errors below.</div>
        {{ form.errors }}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="id_username">Username</label>
        <input id="id_username" type="text" name="username"
               autocomplete="username" required>

        <label for="id_password1">Password</label>
        <input id="id_password1" type="password" name="password1"
               autocomplete="new-password" required>

        <label for="id_password2">Confirm password</label>
        <input id="id_password2" type="password" name="password2"
               autocomplete="new-password" required>

        <button class="btn primary full" type="submit">Create account</button>
    </form>

    <p class="form-footer">
        Have an account? <a href="{% url 'login' %}">Sign in</a>
    </p>
</section>
{% endblock %}
